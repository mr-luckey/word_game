name: word_game
description: Word Search Journey Flutter Clone
publish_to: 'none'
version: 10.0.0+10

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  bloc: ^8.1.4
  get_it: ^7.7.0
  go_router: ^14.2.7
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.3.1
  google_mobile_ads: ^5.1.0
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  in_app_purchase: ^3.3.0
  lottie: ^3.1.2
  confetti: ^0.7.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  audioplayers: ^6.0.0
  firebase_core: ^3.8.1
  firebase_analytics: ^11.4.5
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  package_info_plus: ^10.1.0
  in_app_update: ^4.2.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.6

flutter_native_splash:
  color: "#FFFFFF"
  image: tool/splash/splash_native.png
  android_gravity: center
  android_12:
    image: tool/splash/splash_native.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
  ios: false
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/notifications/notifications.json
    - assets/data/
    - assets/data/level_packs/
    - assets/data/achievements_catalog.json
    - assets/images/themes/classic_travel/
    - assets/images/themes/forest_quest/
    - assets/images/themes/neon_city/
    - assets/images/themes/sunset_safari/
    - assets/images/themes/winter_alps/
    - assets/images/themes/dark_luxury/
    - assets/images/themes/ocean_escape/
    - assets/images/ui/
    - assets/animations/
    - assets/audio/
